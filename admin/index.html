<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantix Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; 
      background: #0a0e1a; 
      color: #e5e7eb; 
      line-height: 1.5;
    }
    
    /* Header */
    header { 
      background: rgba(17, 24, 39, 0.8); 
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(75, 85, 99, 0.3); 
      padding: 14px 20px; 
      position: sticky; 
      top: 0; 
      z-index: 100;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    
    /* Container */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    
    /* Date Range */
    .date-range { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 20px; 
      overflow-x: auto; 
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .date-btn { 
      padding: 8px 16px; 
      background: rgba(31, 41, 55, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.3); 
      color: #9ca3af; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 13px; 
      white-space: nowrap;
      transition: all 0.2s;
      font-weight: 500;
    }
    .date-btn:hover { background: rgba(31, 41, 55, 0.8); color: #e5e7eb; }
    .date-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    
    /* Stats Grid */
    .stats { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 14px; 
      margin-bottom: 20px; 
    }
    .stat { 
      background: rgba(17, 24, 39, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.2); 
      border-radius: 12px; 
      padding: 16px; 
    }
    .stat-label { 
      font-size: 12px; 
      color: #9ca3af; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      margin-bottom: 8px; 
      font-weight: 500;
    }
    .stat-value { 
      font-size: 28px; 
      font-weight: 700; 
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    
    /* Charts */
    .charts { 
      display: grid; 
      grid-template-columns: 2fr 1fr; 
      gap: 14px; 
      margin-bottom: 20px; 
    }
    .chart-card { 
      background: rgba(17, 24, 39, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.2); 
      border-radius: 12px; 
      padding: 16px; 
      min-height: 280px;
    }
    .chart-card h2 { 
      font-size: 14px; 
      font-weight: 600; 
      margin-bottom: 16px; 
      color: #e5e7eb;
    }
    
    /* Table */
    .table-card { 
      background: rgba(17, 24, 39, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.2); 
      border-radius: 12px; 
      overflow: hidden; 
    }
    .table-header { 
      padding: 16px; 
      border-bottom: 1px solid rgba(75, 85, 99, 0.2); 
    }
    .table-header h2 { 
      font-size: 14px; 
      font-weight: 600; 
    }
    
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(17, 24, 39, 0.4); }
    th { 
      padding: 10px 16px; 
      text-align: left; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      color: #9ca3af; 
      font-weight: 600; 
      border-bottom: 1px solid rgba(75, 85, 99, 0.2);
    }
    td { 
      padding: 12px 16px; 
      border-bottom: 1px solid rgba(75, 85, 99, 0.1); 
      font-size: 13px; 
    }
    tr:hover { background: rgba(31, 41, 55, 0.3); }
    
    .order-id { 
      color: #60a5fa; 
      font-weight: 600; 
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 12px;
    }
    
    /* Loading State */
    .loading { 
      text-align: center; 
      padding: 80px 20px; 
      font-size: 14px; 
      color: #6b7280; 
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .stats { grid-template-columns: 1fr; gap: 10px; }
      .stat { padding: 12px; }
      .stat-value { font-size: 24px; }
      
      .charts { grid-template-columns: 1fr; gap: 10px; }
      .chart-card { padding: 12px; min-height: 240px; }
      
      .date-range { gap: 6px; }
      .date-btn { padding: 6px 12px; font-size: 12px; }
      
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
      
      /* Hide columns on mobile */
      th:nth-child(3), td:nth-child(3),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vantix Analytics</h1>
  </header>

  <div class="container">
    <div class="loading" id="loading">Loading...</div>
    
    <div id="dashboard" style="display: none;">
      <div class="date-range">
        <button class="date-btn active" data-range="all">All Time</button>
        <button class="date-btn" data-range="30d">30 Days</button>
        <button class="date-btn" data-range="7d">7 Days</button>
        <button class="date-btn" data-range="today">Today</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Revenue</div>
          <div class="stat-value" id="revenue">$0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Orders</div>
          <div class="stat-value" id="orders">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Order</div>
          <div class="stat-value" id="avg">$0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Profit</div>
          <div class="stat-value" id="profit">$0</div>
        </div>
      </div>

      <div class="charts">
        <div class="chart-card">
          <h2>Revenue</h2>
          <canvas id="revenueChart" height="200"></canvas>
        </div>
        <div class="chart-card">
          <h2>Payment</h2>
          <canvas id="paymentChart" height="200"></canvas>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h2>Orders</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1n1YnFDUHyufWPXLAFOxz6RNkPGLr6gajG8JVc00cxTs/gviz/tq?tqx=out:csv&sheet=Orders';
    
    let allOrders = [];
    let currentRange = 'all';
    let revenueChart, paymentChart;

    init();

    async function init() {
      try {
        await loadOrders();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        setupFilters();
        updateDashboard();
      } catch (err) {
        document.getElementById('loading').innerHTML = `<div style="color: #ef4444;">Error: ${err.message}</div>`;
      }
    }

    async function loadOrders() {
      const response = await fetch(SHEET_URL);
      const csvText = await response.text();
      
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allOrders = results.data.map(row => ({
            order_number: row['Order#'] || '',
            timestamp: row['Timestamp'] || '',
            name: row['Name'] || '',
            payment: (row['Payment'] || '').toLowerCase(),
            total: parseFloat((row['Total'] || '').replace('$', '')) || 0,
            net_profit: parseFloat((row['Net Profit'] || '').replace('$', '')) || 0,
            status: (row['Status'] || 'pending').toLowerCase()
          })).filter(o => o.order_number && o.total > 0);
        }
      });
    }

    function setupFilters() {
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRange = btn.dataset.range;
          updateDashboard();
        });
      });
    }

    function filterByDate(orders, range) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      let start;
      switch(range) {
        case 'today': start = today; break;
        case '7d': start = new Date(today - 7 * 24 * 60 * 60 * 1000); break;
        case '30d': start = new Date(today - 30 * 24 * 60 * 60 * 1000); break;
        case 'all': return orders;
        default: return orders;
      }
      
      return orders.filter(o => new Date(o.timestamp) >= start);
    }

    function updateDashboard() {
      const filtered = filterByDate(allOrders, currentRange);
      updateStats(filtered);
      updateCharts(filtered);
      renderTable(filtered);
    }

    function updateStats(orders) {
      const revenue = orders.reduce((sum, o) => sum + o.total, 0);
      const profit = orders.reduce((sum, o) => sum + o.net_profit, 0);
      const avg = orders.length > 0 ? revenue / orders.length : 0;

      document.getElementById('revenue').textContent = '$' + revenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('orders').textContent = orders.length;
      document.getElementById('avg').textContent = '$' + avg.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('profit').textContent = '$' + profit.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function updateCharts(orders) {
      const dates = {};
      orders.forEach(o => {
        const d = new Date(o.timestamp).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
        dates[d] = (dates[d] || 0) + o.total;
      });

      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
          labels: Object.keys(dates).slice(-30),
          datasets: [{
            data: Object.values(dates).slice(-30),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            tension: 0.4,
            fill: true,
            borderWidth: 2,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { 
              beginAtZero: true, 
              ticks: { color: '#6b7280', font: { size: 11 } }, 
              grid: { color: 'rgba(75, 85, 99, 0.1)' },
              border: { display: false }
            },
            x: { 
              ticks: { color: '#6b7280', font: { size: 11 } }, 
              grid: { display: false },
              border: { display: false }
            }
          }
        }
      });

      const payments = {};
      orders.forEach(o => {
        const method = o.payment || 'unknown';
        payments[method] = (payments[method] || 0) + o.total;
      });

      if (paymentChart) paymentChart.destroy();
      paymentChart = new Chart(document.getElementById('paymentChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(payments).map(p => p.charAt(0).toUpperCase() + p.slice(1)),
          datasets: [{
            data: Object.values(payments),
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: 'bottom', 
              labels: { 
                color: '#9ca3af',
                font: { size: 11 },
                padding: 12
              } 
            } 
          }
        }
      });
    }

    function renderTable(orders) {
      const html = orders.slice(0, 100).map(o => `
        <tr>
          <td><span class="order-id">${o.order_number}</span></td>
          <td>${new Date(o.timestamp).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}</td>
          <td>${o.name}</td>
          <td style="font-weight: 600; font-variant-numeric: tabular-nums;">$${o.total.toFixed(2)}</td>
          <td>${o.payment.charAt(0).toUpperCase() + o.payment.slice(1).replace('_', ' ')}</td>
          <td>${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</td>
        </tr>
      `).join('');
      document.getElementById('ordersTable').innerHTML = html || '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #6b7280;">No orders</td></tr>';
    }
  </script>
</body>
</html>
