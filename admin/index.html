<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantix Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      background: #0a0e1a; 
      color: #e5e7eb; 
      padding: 20px;
    }
    
    .header { 
      background: rgba(17, 24, 39, 0.8); 
      border: 1px solid rgba(75, 85, 99, 0.3); 
      border-radius: 8px;
      padding: 16px; 
      margin-bottom: 20px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    
    .filters { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
    }
    .filter-btn { 
      padding: 8px 14px; 
      background: rgba(31, 41, 55, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.3); 
      color: #9ca3af; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 13px;
    }
    .filter-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    
    .stats { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 12px; 
      margin-bottom: 20px; 
    }
    .stat { 
      background: rgba(17, 24, 39, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.2); 
      border-radius: 8px; 
      padding: 16px; 
    }
    .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; }
    
    .table-wrapper { 
      background: rgba(17, 24, 39, 0.6); 
      border: 1px solid rgba(75, 85, 99, 0.2); 
      border-radius: 8px; 
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th { 
      padding: 10px; 
      text-align: left; 
      font-size: 11px; 
      text-transform: uppercase; 
      color: #9ca3af; 
      border-bottom: 1px solid rgba(75, 85, 99, 0.2);
    }
    td { 
      padding: 10px; 
      border-bottom: 1px solid rgba(75, 85, 99, 0.1); 
      font-size: 13px; 
    }
    tr:hover { background: rgba(31, 41, 55, 0.3); }
    
    .loading { text-align: center; padding: 60px 20px; color: #6b7280; }
    .error { color: #ef4444; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vantix Analytics</h1>
  </div>

  <div class="loading" id="loading">Loading data...</div>
  
  <div id="dashboard" style="display: none;">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all')">All Time</button>
      <button class="filter-btn" onclick="setFilter('today')">Today</button>
      <button class="filter-btn" onclick="setFilter('yesterday')">Yesterday</button>
      <button class="filter-btn" onclick="setFilter('thisweek')">This Week</button>
      <button class="filter-btn" onclick="setFilter('lastweek')">Last Week</button>
      <button class="filter-btn" onclick="setFilter('thismonth')">This Month</button>
      <button class="filter-btn" onclick="setFilter('lastmonth')">Last Month</button>
      <button class="filter-btn" onclick="setFilter('30d')">Last 30d</button>
      <button class="filter-btn" onclick="setFilter('90d')">Last 90d</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Revenue</div>
        <div class="stat-value" id="revenue">$0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Orders</div>
        <div class="stat-value" id="orders">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Avg Order</div>
        <div class="stat-value" id="avg">$0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Profit</div>
        <div class="stat-value" id="profit">$0</div>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Date</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1n1YnFDUHyufWPXLAFOxz6RNkPGLr6gajG8JVc00cxTs/gviz/tq?tqx=out:csv&sheet=Orders';
    
    let allOrders = [];
    let currentFilter = 'all';

    init();

    async function init() {
      try {
        await loadData();
        console.log('Total orders loaded:', allOrders.length);
        console.log('Sample order:', allOrders[0]);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        updateStats();
        renderTable();
      } catch (err) {
        document.getElementById('loading').innerHTML = `<div class="error">Error loading data: ${err.message}</div>`;
        console.error('Dashboard error:', err);
      }
    }

    async function loadData() {
      const response = await fetch(SHEET_URL);
      if (!response.ok) throw new Error('Failed to fetch data');
      
      const text = await response.text();
      const lines = text.split('\n');
      const headers = parseCSVLine(lines[0]);
      
      allOrders = lines.slice(1)
        .filter(line => line.trim())
        .map(line => {
          const values = parseCSVLine(line);
          const timestamp = parseDate(values[1]);
          return {
            order_number: values[0] || '',
            timestamp: timestamp,
            timestampMs: timestamp ? timestamp.getTime() : 0,
            email: values[2] || '',
            name: values[3] || '',
            phone: values[4] || '',
            total: parseFloat((values[16] || '').replace(/[$,]/g, '')) || 0,
            payment: (values[11] || '').toLowerCase(),
            net_profit: parseFloat((values[19] || '').replace(/[$,]/g, '')) || 0,
            status: (values[20] || 'pending').toLowerCase()
          };
        })
        .filter(o => o.order_number && o.total > 0 && o.timestampMs > 0);
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      // Parse "6/4/2026 12:01:31" format
      const parts = dateStr.split(' ');
      if (parts.length !== 2) return null;
      
      const dateParts = parts[0].split('/');
      const timeParts = parts[1].split(':');
      
      if (dateParts.length !== 3 || timeParts.length !== 3) return null;
      
      const month = parseInt(dateParts[0]) - 1; // JS months are 0-indexed
      const day = parseInt(dateParts[1]);
      const year = parseInt(dateParts[2]);
      const hour = parseInt(timeParts[0]);
      const minute = parseInt(timeParts[1]);
      const second = parseInt(timeParts[2]);
      
      return new Date(year, month, day, hour, minute, second);
    }

    function setFilter(range) {
      currentFilter = range;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      updateStats();
      renderTable();
    }

    function filterOrders() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      let start, end;
      
      switch(currentFilter) {
        case 'today':
          start = today;
          end = new Date(today.getTime() + 24 * 60 * 60 * 1000);
          break;
        case 'yesterday':
          start = new Date(today.getTime() - 24 * 60 * 60 * 1000);
          end = today;
          break;
        case 'thisweek':
          const dayOfWeek = now.getDay();
          const daysToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
          start = new Date(today.getTime() - daysToMonday * 24 * 60 * 60 * 1000);
          end = new Date();
          break;
        case 'lastweek':
          const lastSunday = new Date(today.getTime() - today.getDay() * 24 * 60 * 60 * 1000);
          start = new Date(lastSunday.getTime() - 7 * 24 * 60 * 60 * 1000);
          end = lastSunday;
          break;
        case 'thismonth':
          start = new Date(now.getFullYear(), now.getMonth(), 1);
          end = new Date();
          break;
        case 'lastmonth':
          start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          end = new Date(now.getFullYear(), now.getMonth(), 1);
          break;
        case '30d':
          start = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
          end = new Date();
          break;
        case '90d':
          start = new Date(today.getTime() - 90 * 24 * 60 * 60 * 1000);
          end = new Date();
          break;
        case 'all':
        default:
          return allOrders;
      }
      
      return allOrders.filter(o => {
        return o.timestampMs >= start.getTime() && o.timestampMs < end.getTime();
      });
    }

    function updateStats() {
      const filtered = filterOrders();
      const revenue = filtered.reduce((sum, o) => sum + o.total, 0);
      const profit = filtered.reduce((sum, o) => sum + o.net_profit, 0);
      const avg = filtered.length > 0 ? revenue / filtered.length : 0;

      document.getElementById('revenue').textContent = '$' + revenue.toFixed(2);
      document.getElementById('orders').textContent = filtered.length;
      document.getElementById('avg').textContent = '$' + avg.toFixed(2);
      document.getElementById('profit').textContent = '$' + profit.toFixed(2);
    }

    function renderTable() {
      const filtered = filterOrders();
      const html = filtered.slice(0, 100).map(o => `
        <tr>
          <td style="font-family: monospace; color: #60a5fa;">${o.order_number}</td>
          <td>${new Date(o.timestamp).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}</td>
          <td>${o.name}</td>
          <td style="font-weight: 600;">$${o.total.toFixed(2)}</td>
          <td>${o.payment.charAt(0).toUpperCase() + o.payment.slice(1).replace('_', ' ')}</td>
          <td>${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</td>
        </tr>
      `).join('');
      document.getElementById('ordersTable').innerHTML = html || '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #6b7280;">No orders</td></tr>';
    }
  </script>
</body>
</html>
