<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vantix Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4EF;--ink:#0F1B2D;--mut:#5E6877;--line:#E1DED4;--line2:#ECEAE2;--card:#fff;--blue:#3973B0;--blue-d:#2D5E92;--blue-t:#E7EEF7;--gold:#C9A24A;--navy:#0F1B2D;--navy-mut:#9FB0C6;--green:#2F6B4F;--red:#A5473B;--r:16px;--sh:0 1px 2px rgba(15,27,45,.05),0 8px 24px -12px rgba(15,27,45,.10)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:244px;flex-shrink:0;background:var(--navy);color:#FAFAF7;display:flex;flex-direction:column;gap:28px;padding:26px 16px 22px;position:sticky;top:0;height:100vh;align-self:flex-start}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.brand b{display:block;font-weight:600;font-size:15px;letter-spacing:2px;line-height:1.2}
.brand small{font-size:11px;color:var(--navy-mut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:#C9D4E3;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav button svg{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button .lab{flex:1}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav .moreBtn{display:none}
.badge{background:var(--gold);color:var(--navy);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px;line-height:1.5}
.side .foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--navy-mut);display:flex;flex-direction:column;gap:10px}
.side .foot button{align-self:flex-start;border:1px solid rgba(255,255,255,.22);background:transparent;color:#FAFAF7;border-radius:10px;padding:7px 14px;font-size:12px}
.side .foot button:hover{background:rgba(255,255,255,.08)}
.main{flex:1;min-width:0;width:100%;max-width:1380px;margin:0 auto;padding:34px 44px 72px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* controls */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:#F8F7F2;border-color:#D3CFC3}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red);border-color:#E4C2BC}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,115,176,.14);outline:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;background:#fff;min-width:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:14px}
.cmp h4{grid-column:1/-1;margin:0;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cmp .full{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:background .15s}
.chip:hover{background:#F8F7F2}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip i{font-style:normal;font-size:11px;opacity:.65}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-green{background:#DDEEE3;color:#245238}.c-blue{background:#DCE8F5;color:#1F4A7A}.c-gold{background:#F6E7C8;color:#6B4B0A}.c-red{background:#F3D9D4;color:#7D2F25}.c-gray{background:#E8E6DE;color:#4A5160}.c-navy{background:#DFE4EC;color:#0F1B2D}
/* cards */
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh)}
.card h2{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.005em}
.card .hint{font-size:12px;color:var(--mut);margin-bottom:14px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.todo{position:relative;display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--line2);background:#fff;border-radius:var(--r);padding:16px 20px 16px 24px;width:100%;box-shadow:inset 4px 0 0 var(--ac,var(--blue)),var(--sh);transition:transform .15s,border-color .15s}
.todo:hover{border-color:#D3CFC3}
.todo b{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.todo span{font-size:13px;font-weight:600}
.todo small{font-size:12px;color:var(--mut);line-height:1.4}
.kpi .lab{font-size:12.5px;color:var(--mut);font-weight:500}
.kpi .val{font-size:28px;font-weight:600;line-height:1.2;margin-top:4px;letter-spacing:-.02em}
.kpi .d{font-size:12px;margin-top:4px;color:var(--mut)}
.kpi.hero{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hero .lab,.kpi.hero .d{color:var(--navy-mut)}
.kpi.hero .val{font-size:34px}
.kpi.hero .up{color:#8FD3AC}.kpi.hero .dn{color:#F2AEA3}
.up{color:#245238;font-weight:600}.dn{color:#7D2F25;font-weight:600}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:12px 16px;background:#FBFAF6;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover td{background:#F8F7F2}
td.r,th.r{text-align:right}
.mini{width:100%;font-size:13px}.mini td{padding:9px 0;border-bottom:1px solid var(--line2)}.mini th{padding:8px 0;background:transparent}
.tw>.mini td,.tw>.mini th{padding-left:12px;padding-right:12px}
.bar{height:6px;background:var(--line2);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line2);gap:2px}
.split i{border-radius:999px}
.empty{padding:32px;text-align:center;color:var(--mut);font-size:13px}
/* charts */
.chartbox{width:100%;min-height:200px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox rect.b{fill:var(--blue);transition:opacity .12s}
.chartbox rect.b:hover{opacity:.78}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:40;animation:fade .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:#fff;z-index:41;overflow-y:auto;padding:24px 26px 44px;display:flex;flex-direction:column;gap:20px;box-shadow:-16px 0 48px rgba(15,27,45,.22);animation:slide .24s cubic-bezier(.2,.8,.2,1)}
.drawer h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:7px}
.sec>h4{margin:0 0 2px;font-size:12px;color:var(--mut);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv span:first-child{color:var(--mut)}
.kv.tot{border-top:2px solid var(--navy);padding-top:9px;margin-top:5px;font-weight:700;font-size:15px}
.kv.tot span:first-child{color:var(--ink)}
.note{background:#FBF4E2;border:1px solid #F0DDA8;border-radius:12px;padding:11px 14px;font-size:12px;color:#6B4B0A}
.note.red{background:#F8E6E2;border-color:#E4C2BC;color:#7D2F25}
.tl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.tl div{display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;animation:fade .2s ease}
.toast.err{background:var(--red)}
.banner{background:#F8E6E2;border:1px solid #E4C2BC;color:#7D2F25;border-radius:12px;padding:11px 15px;font-size:13px}
.moresheet{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:18px;padding:8px;z-index:52;box-shadow:0 16px 48px rgba(15,27,45,.3);animation:rise .2s ease}
.moresheet button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:14px 14px;border-radius:12px;font-size:15px;font-weight:500;min-height:48px}
.moresheet button:active{background:#F3F1EA}
.moresheet svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.moresheet hr{border:0;border-top:1px solid var(--line2);margin:4px 8px}
@keyframes slide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:392px;background:#fff;border:1px solid var(--line2);border-radius:20px;padding:36px 30px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sh)}
.logo{text-align:center;font-size:24px;font-weight:700;letter-spacing:3px;line-height:1}
.logo span{color:var(--blue)}
.login p{margin:0;text-align:center;color:var(--mut);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:30px 28px 64px}}
@media (max-width:860px){
 .shell{flex-direction:column}
 .side{width:auto;height:auto;position:sticky;top:0;z-index:30;align-self:stretch;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 .brand .mark{width:32px;height:32px}
 .brand small{display:none}
 .side .foot{display:none}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(15,27,45,.97);border-top:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
 .nav button{flex:1;min-width:0;flex-direction:column;gap:3px;padding:7px 2px;border-radius:12px;font-size:10.5px;justify-content:center;text-align:center;box-shadow:none!important}
 .nav button.on{background:rgba(255,255,255,.1);color:#fff}
 .nav button.on svg{stroke:var(--gold)}
 .nav button .lab{flex:none}
 .nav button.extra{display:none}
 .nav .moreBtn{display:flex}
 .nav button .badge{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;padding:0 6px}
 .main{padding:20px 16px calc(104px + env(safe-area-inset-bottom,0px));gap:18px}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 h1{font-size:23px}
 .card{padding:18px 18px}
 .kpi .val{font-size:24px}.kpi.hero .val{font-size:28px}
 .drawer{top:auto;left:0;right:0;width:100%;max-height:92%;border-radius:22px 22px 0 0;padding:20px 20px 40px;box-shadow:0 -12px 40px rgba(15,27,45,.25);animation:rise .26s cubic-bezier(.2,.8,.2,1)}
 .drawer::before{content:"";align-self:center;width:42px;height:4px;border-radius:99px;background:#D9D6CB;margin-bottom:-6px}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}
 .btn,.chip{min-height:42px}.btn.sm{min-height:34px}
 input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{font-size:16px;padding:12px 14px}
 .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
 /* tables become cards */
 .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
 table.stack,table.stack tbody{display:block}
 table.stack thead{display:none}
 table.stack tr{display:block;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
 table.stack td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 0;border:0;text-align:right}
 table.stack td::before{content:attr(data-label);color:var(--mut);font-size:12px;text-align:left;flex-shrink:0}
 table.stack td:first-child{justify-content:flex-start;font-size:15px;padding-bottom:6px}
 table.stack td:first-child::before{display:none}
 table.stack td[data-label=""]::before{display:none}
 table.stack tr.click:hover td{background:transparent}
 table.stack tr.click:active{background:#F8F7F2}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.todo{padding:13px 14px 13px 18px}.todo b{font-size:25px}.todo small{display:none}.kpi.hero{grid-column:1/-1}.g4>.kpi:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ---------- config ---------- */
const SB_URL = 'https://mxhtxcpqgjmgwnurxguv.supabase.co';
const SB_KEY = 'sb_publishable_S1BVqOpFWobGC2XiJV-E2w_BvJkkIkv';   // public key; every table is locked to signed-in admins by row-level security
const WORKER = 'https://vantix-checkout.prcpeptides.workers.dev';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1n1YnFDUHyufWPXLAFOxz6RNkPGLr6gajG8JVc00cxTs/edit';
const TZ = 'America/Los_Angeles';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

/* ---------- helpers ---------- */
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = (v) => Number(v) || 0;
const usd = (n, d = 2) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const dkey = (d) => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ });
const hourOf = (d) => parseInt(new Date(d).toLocaleString('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }), 10) % 24;
const fdate = (d) => new Date(d).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const fday = (k) => new Date(k + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const PAYNAME = { zelle: 'Zelle', credit_card: 'Card' };

/* ---------- state ---------- */
const S = { session: null, tab: 'home', channel: 'all', range: '30', cA: { from: '', to: '' }, cB: { from: '', to: '' }, cBOn: true, cBTouched: false, orders: [], products: [], codes: [], settings: [], moves: [], kits: [], events: {},
  filter: 'All', q: '', cq: '', cseg: 'All', pq: '', sel: null, selProd: null, form: {}, armed: null, busy: false, toast: null, loaded: false, error: '', newCode: false, loginErr: '' };

function toast(msg, err) { S.toast = { msg, err }; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, err ? 6000 : 3000); }

/* ---------- derived data ---------- */
function ostat(o) {
  const p = o.payment_status, f = o.fulfillment_status;
  if (p === 'paid') { if (f === 'delivered') return ['Delivered', 'green']; if (f === 'shipped') return ['Shipped', 'blue']; if (f === 'cancelled') return ['Cancelled', 'gray']; return ['Paid · to ship', 'gold']; }
  if (p === 'pending') return ['Awaiting payment', 'gold'];
  if (p === 'review') return ['Review card', 'red'];
  if (p === 'failed') return ['Failed', 'gray'];
  if (p === 'refunded') return ['Refunded', 'gray'];
  return [p, 'gray'];
}
const isPaid = (o) => o.payment_status === 'paid';
const chanOf = (o) => o.channel === 'wholesale' ? 'wholesale' : 'retail';
const chanOk = (o) => S.channel === 'all' || chanOf(o) === S.channel;
const CHANNELS = [['all', 'All sales'], ['retail', 'Retail'], ['wholesale', 'Wholesale']];
function chanChips() { return '<div class="chips">' + CHANNELS.map((x) => '<button class="chip' + (S.channel === x[0] ? ' on' : '') + '" data-act="chan" data-arg="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>'; }
const profitOf = (o) => n0(o.total) - n0(o.cogs) - n0(o.packaging_cost) - n0(o.processing_fee) - n0(o.commission) - n0(o.label_cost);
const incomplete = (o) => o.cost_missing || o.cogs == null || o.label_cost == null;
const itemsText = (o) => (o.order_items || []).map((i) => i.qty + '× ' + i.name).join(', ');

function getRange() {
  const today = dkey(new Date()), r = S.range;
  if (r === 'today') return { label: 'Today', days: 1, start: today, test: (k) => k === today, prev: (k) => k === addDays(today, -1), prevLabel: 'yesterday' };
  if (r === '7' || r === '30') { const n = +r, start = addDays(today, -(n - 1)), ps = addDays(start, -n), pe = addDays(start, -1);
    return { label: 'Last ' + n + ' days', days: n, start, test: (k) => k >= start && k <= today, prev: (k) => k >= ps && k <= pe, prevLabel: 'the previous ' + n + ' days' }; }
  if (r === 'mtd') { const ms = today.slice(0, 7) + '-01', pm = addDays(ms, -1).slice(0, 7), dd = +today.slice(8);
    return { label: 'This month', days: dd, start: ms, test: (k) => k >= ms && k <= today, prev: (k) => k.slice(0, 7) === pm && +k.slice(8) <= dd, prevLabel: 'last month so far' }; }
  if (r === 'custom') {

  customers: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  discounts: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  analytics: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

};
const ico = (k) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + '</svg>';
const EXTRA = ['discounts', 'analytics', 'settings'];
const TABS = [['home', 'Home', 'Today at a glance'], ['orders', 'Orders', 'Confirm payments and ship'], ['products', 'Products', 'Prices, costs and stock'], ['customers', 'Customers', 'Who buys and who is due'], ['discounts', 'Discounts', 'Codes and influencer commissions'], ['analytics', 'Analytics', 'Trends and where the money goes'], ['settings', 'Settings', 'Account and business numbers']];
function render() {
  CHARTS.length = 0;
  const app = document.getElementById('app'), ae = document.activeElement, aid = ae && ae.id, pos = ae && ae.selectionStart;
  if (!S.session) {
    app.innerHTML = '<div class="login"><form class="box" id="loginForm"><div class="logo">VANTIX <span>BIO</span></div><p>Admin sign in</p>' + (S.loginErr ? '<div class="banner" role="alert">' + esc(S.loginErr) + '</div>' : '') +
      '<label class="f">Email<input type="email" name="email" required autocomplete="username"></label><label class="f">Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn pri" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Signing in…' : 'Sign in') + '</button></form></div>';
    return;
  }
  const c = counts(), badge = { orders: c.toShip + c.pending + c.review, products: lowStock().length }, t = TABS.find((x) => x[0] === S.tab);
  const body = !S.loaded ? '<div class="empty">Loading…</div>' : { home: viewHome, orders: viewOrders, products: viewProducts, customers: viewCustomers, discounts: viewDiscounts, analytics: viewAnalytics, settings: viewSettings }[S.tab]();
  app.innerHTML = '<div class="shell"><aside class="side"><div class="brand"><div class="mark">VX</div><div><b>VANTIX</b><small>Admin</small></div></div><nav class="nav" aria-label="Sections">' +
    TABS.map((x) => '<button class="' + (S.tab === x[0] ? 'on' : '') + (EXTRA.includes(x[0]) ? ' extra' : '') + '" data-act="tab" data-arg="' + x[0] + '"' + (S.tab === x[0] ? ' aria-current="page"' : '') + '>' + ico(x[0]) + '<span class="lab">' + x[1] + '</span>' + (badge[x[0]] ? '<span class="badge">' + badge[x[0]] + '</span>' : '') + '</button>').join('') +
    '<button class="moreBtn' + (S.more || EXTRA.includes(S.tab) ? ' on' : '') + '" data-act="more" aria-expanded="' + !!S.more + '">' + ico('more') + '<span class="lab">More</span></button></nav><div class="foot"><span>vantixbio.com</span><button data-act="logout">Sign out</button></div></aside><main class="main"><div class="top"><div><h1>' + t[1] + '</h1><div class="sub">' + t[2] + '</div></div><div class="row">' +
    (S.tab === 'orders' ? '<button class="btn" data-act="csv">Export CSV</button>' : '') + '<button class="btn" data-act="refresh">Refresh</button></div></div>' + (S.error ? '<div class="banner" role="alert">' + esc(S.error) + '</div>' : '') + body + '</main></div>' +
    (S.more ? '<div class="scrim" data-act="more"></div><div class="moresheet">' + EXTRA.map((k) => '<button data-act="tab" data-arg="' + k + '">' + ico(k) + TABS.find((x) => x[0] === k)[1] + '</button>').join('') + '<hr><button data-act="logout">' + ico('out') + 'Sign out</button></div>' : '') + (S.sel ? orderDrawer() : '') + (S.selProd ? prodDrawer() : '') + (S.toast ? '<div class="toast' + (S.toast.err ? ' err' : '') + '" role="status">' + esc(S.toast.msg) + '</div>' : '');
  drawCharts(); stackTables();
  if (aid) { const el = document.getElementById(aid); if (el && el !== document.activeElement) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }
}

/* ---------- start ---------- */
async function start() {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (!S.session) { S.loaded = false; return render(); }
  const adm = await sb.rpc('is_admin');
  if (adm.error || adm.data !== true) { await sb.auth.signOut(); S.session = null; S.loginErr = 'This login is not set up as an admin.'; return render(); }
  S.loaded = false; render(); await load(); render();
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.session = null; render(); } });
setInterval(async () => { if (!S.session || document.hidden || S.sel || S.selProd || S.newCode || S.busy) return; const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return; await load(true); render(); }, 60000);
start();
</script>
