<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantix Analytics — Enterprise Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e1a; --surface: #111827; --elevated: #1f2937;
      --border: #374151; --text: #f9fafb; --muted: #9ca3af;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    
    /* Login */
    .login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--surface); padding: 48px; border-radius: 12px; width: 400px; border: 1px solid var(--border); }
    .login h1 { margin-bottom: 32px; font-size: 28px; font-weight: 600; }
    .login input { width: 100%; padding: 12px; background: var(--elevated); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 16px; }
    .login button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .login button:hover { opacity: 0.9; }
    
    /* App */
    .app { display: none; }
    .app.show { display: block; }
    
    /* Header */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 20px; font-weight: 600; }
    .logout { background: var(--elevated); color: var(--text); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    
    /* Container */
    .container { max-width: 1600px; margin: 0 auto; padding: 32px; }
    
    /* Date Range */
    .date-range { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .date-btn { padding: 10px 20px; background: var(--elevated); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .date-btn:hover, .date-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    /* Stats Grid */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .stat-change { font-size: 14px; }
    .stat-change.up { color: var(--success); }
    .stat-change.down { color: var(--danger); }
    
    /* Charts */
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    
    /* Table */
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .table-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .table-header h2 { font-size: 18px; font-weight: 600; }
    .table-filters { display: flex; gap: 12px; }
    .table-filters select { padding: 8px 12px; background: var(--elevated); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--elevated); position: sticky; top: 60px; }
    th { padding: 12px 24px; text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    th:hover { background: var(--surface); }
    td { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    tr:hover { background: var(--elevated); }
    .order-id { color: var(--primary); font-weight: 600; cursor: pointer; }
    .order-id:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-paid { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .badge-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    
    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 800px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 20px; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
    .modal-body { padding: 24px; }
    .detail-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; margin-bottom: 12px; }
    .detail-label { color: var(--muted); font-size: 13px; }
    
    /* Mobile Optimization */
    @media (max-width: 768px) {
      .container { padding: 16px; }
      
      .date-range { gap: 8px; }
      .date-btn { padding: 8px 12px; font-size: 12px; }
      
      .stats { grid-template-columns: 1fr; gap: 12px; }
      .stat-value { font-size: 28px; }
      
      .charts { grid-template-columns: 1fr; gap: 16px; }
      
      .table-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .table-filters { flex-direction: column; width: 100%; }
      .table-filters select { width: 100%; }
      
      table { font-size: 13px; }
      th, td { padding: 10px 12px; }
      th { font-size: 11px; }
      
      /* Hide customer column and payment method on mobile */
      th:nth-child(3), td:nth-child(3),
      th:nth-child(5), td:nth-child(5) { display: none; }
      
      .modal-content { width: 95%; margin: 20px; }
      .modal-header h3 { font-size: 18px; }
      .detail-row { grid-template-columns: 100px 1fr; gap: 8px; font-size: 13px; }
    }
    
    @media (max-width: 480px) {
      header h1 { font-size: 16px; }
      .logout { padding: 6px 12px; font-size: 12px; }
      
      .stat-card { padding: 16px; }
      .stat-value { font-size: 24px; }
      .chart-card { padding: 16px; }
      
      /* Stack date range buttons in 2 columns */
      .date-range { display: grid; grid-template-columns: 1fr 1fr; }
      
      /* Hide date column on very small screens, keep order#, total, status */
      th:nth-child(2), td:nth-child(2) { display: none; }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div class="login" id="loginScreen">
    <div class="login-box">
      <h1>Vantix Analytics</h1>
      <input type="password" id="passwordInput" placeholder="Password" />
      <button onclick="login()">Login</button>
      <p id="loginError" style="color: var(--danger); margin-top: 12px; font-size: 14px;"></p>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app">
    <header>
      <h1>Vantix Analytics Dashboard</h1>
      <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="container">
      <!-- Date Range Selector -->
      <div class="date-range">
        <button class="date-btn active" data-range="today">Today</button>
        <button class="date-btn" data-range="yesterday">Yesterday</button>
        <button class="date-btn" data-range="7d">Last 7 Days</button>
        <button class="date-btn" data-range="30d">Last 30 Days</button>
        <button class="date-btn" data-range="90d">Last 90 Days</button>
        <button class="date-btn" data-range="mtd">Month to Date</button>
        <button class="date-btn" data-range="ytd">Year to Date</button>
        <button class="date-btn" data-range="all">All Time</button>
      </div>

      <!-- Stats Grid -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="totalRevenue">$0</div>
          <div class="stat-change" id="revenueChange">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Orders</div>
          <div class="stat-value" id="totalOrders">0</div>
          <div class="stat-change" id="ordersChange">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average Order Value</div>
          <div class="stat-value" id="avgOrderValue">$0</div>
          <div class="stat-change" id="aovChange">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Net Profit</div>
          <div class="stat-value" id="netProfit">$0</div>
          <div class="stat-change" id="profitChange">—</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="charts">
        <div class="chart-card">
          <div class="chart-title">Revenue Over Time</div>
          <canvas id="revenueChart"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">Top Products</div>
          <canvas id="productsChart"></canvas>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="table-card">
        <div class="table-header">
          <h2>Recent Orders</h2>
          <div class="table-filters">
            <select id="statusFilter">
              <option value="all">All Statuses</option>
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
              <option value="shipped">Shipped</option>
            </select>
            <select id="paymentFilter">
              <option value="all">All Payments</option>
              <option value="zelle">Zelle</option>
              <option value="credit_card">Credit Card</option>
            </select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th onclick="sortTable('order_number')">Order #</th>
              <th onclick="sortTable('created_at')">Date</th>
              <th onclick="sortTable('customer_name')">Customer</th>
              <th onclick="sortTable('total')">Total</th>
              <th onclick="sortTable('payment_method')">Payment</th>
              <th onclick="sortTable('status')">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalOrderNumber">Order Details</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = 'VantixAdmin2026!';
    const SUPABASE_URL = 'https://ctujbxqcyfcrhlyvafbl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dWpieHFjeWZjcmhseXZhZmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM3NjI3MzgsImV4cCI6MjAzOTMzODczOH0.wv8g_MJt0r6VV5c38oJ5xFjgzD7xb-PmXj_YY4piBfs';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let allOrders = [];
    let currentRange = 'today';
    let revenueChart, productsChart;

    // Login
    function login() {
      const password = document.getElementById('passwordInput').value;
      console.log('Attempting login with:', password);
      console.log('Expected:', ADMIN_PASSWORD);
      console.log('Match:', password === ADMIN_PASSWORD);
      if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem('vantix_admin_auth', 'true');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('show');
        init();
      } else {
        document.getElementById('loginError').textContent = 'Invalid password';
      }
    }

    function logout() {
      sessionStorage.removeItem('vantix_admin_auth');
      location.reload();
    }

    // Check auth
    if (sessionStorage.getItem('vantix_admin_auth') === 'true') {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      init();
    }

    document.getElementById('passwordInput')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    // Init
    async function init() {
      await loadOrders();
      setupDateFilters();
      updateDashboard();
    }

    // Load orders
    async function loadOrders() {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('Error loading orders:', error);
        return;
      }
      
      allOrders = data;
    }

    // Date filters
    function setupDateFilters() {
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRange = btn.dataset.range;
          updateDashboard();
        });
      });
    }

    function getDateRange(range) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      switch(range) {
        case 'today':
          return { start: today, end: new Date() };
        case 'yesterday':
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);
          return { start: yesterday, end: today };
        case '7d':
          const week = new Date(today);
          week.setDate(week.getDate() - 7);
          return { start: week, end: new Date() };
        case '30d':
          const month = new Date(today);
          month.setDate(month.getDate() - 30);
          return { start: month, end: new Date() };
        case '90d':
          const quarter = new Date(today);
          quarter.setDate(quarter.getDate() - 90);
          return { start: quarter, end: new Date() };
        case 'mtd':
          return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date() };
        case 'ytd':
          return { start: new Date(now.getFullYear(), 0, 1), end: new Date() };
        case 'all':
          return { start: new Date(2020, 0, 1), end: new Date() };
        default:
          return { start: today, end: new Date() };
      }
    }

    function filterOrdersByDate(orders, range) {
      const { start, end } = getDateRange(range);
      return orders.filter(o => {
        const date = new Date(o.created_at);
        return date >= start && date <= end;
      });
    }

    // Update dashboard
    function updateDashboard() {
      const filtered = filterOrdersByDate(allOrders, currentRange);
      updateStats(filtered);
      updateCharts(filtered);
      renderOrdersTable(filtered);
    }

    function updateStats(orders) {
      const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
      const profit = orders.reduce((sum, o) => sum + (o.net_profit || 0), 0);
      const avgOrder = orders.length > 0 ? revenue / orders.length : 0;

      document.getElementById('totalRevenue').textContent = `$${revenue.toFixed(2)}`;
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('avgOrderValue').textContent = `$${avgOrder.toFixed(2)}`;
      document.getElementById('netProfit').textContent = `$${profit.toFixed(2)}`;

      // Calculate changes (compare to previous period)
      const prevPeriodOrders = getPreviousPeriodOrders();
      const prevRevenue = prevPeriodOrders.reduce((sum, o) => sum + (o.total || 0), 0);
      const prevCount = prevPeriodOrders.length;
      const prevProfit = prevPeriodOrders.reduce((sum, o) => sum + (o.net_profit || 0), 0);

      updateChange('revenueChange', revenue, prevRevenue);
      updateChange('ordersChange', orders.length, prevCount);
      updateChange('profitChange', profit, prevProfit);
      updateChange('aovChange', avgOrder, prevCount > 0 ? prevRevenue / prevCount : 0);
    }

    function getPreviousPeriodOrders() {
      const { start, end } = getDateRange(currentRange);
      const duration = end - start;
      const prevStart = new Date(start - duration);
      const prevEnd = new Date(start);
      
      return allOrders.filter(o => {
        const date = new Date(o.created_at);
        return date >= prevStart && date < prevEnd;
      });
    }

    function updateChange(elementId, current, previous) {
      const el = document.getElementById(elementId);
      if (previous === 0) {
        el.textContent = '—';
        el.className = 'stat-change';
        return;
      }
      
      const change = ((current - previous) / previous) * 100;
      const sign = change >= 0 ? '+' : '';
      el.textContent = `${sign}${change.toFixed(1)}% vs prev period`;
      el.className = change >= 0 ? 'stat-change up' : 'stat-change down';
    }

    function updateCharts(orders) {
      // Revenue over time
      const revenueData = groupByDate(orders);
      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
          labels: revenueData.labels,
          datasets: [{
            label: 'Revenue',
            data: revenueData.values,
            borderColor: '#3b82f6',
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(59, 130, 246, 0.1)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: '#374151' } },
            x: { ticks: { color: '#9ca3af' }, grid: { display: false } }
          }
        }
      });

      // Top products
      const productData = getTopProducts(orders);
      if (productsChart) productsChart.destroy();
      productsChart = new Chart(document.getElementById('productsChart'), {
        type: 'doughnut',
        data: {
          labels: productData.labels,
          datasets: [{
            data: productData.values,
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af' } } }
        }
      });
    }

    function groupByDate(orders) {
      const groups = {};
      orders.forEach(o => {
        const date = new Date(o.created_at).toLocaleDateString();
        groups[date] = (groups[date] || 0) + (o.total || 0);
      });
      return {
        labels: Object.keys(groups),
        values: Object.values(groups)
      };
    }

    function getTopProducts(orders) {
      const products = {};
      orders.forEach(o => {
        if (o.items) {
          o.items.forEach(item => {
            const name = item.name || 'Unknown';
            products[name] = (products[name] || 0) + (item.qty * item.price);
          });
        }
      });
      const sorted = Object.entries(products).sort((a, b) => b[1] - a[1]).slice(0, 5);
      return {
        labels: sorted.map(p => p[0]),
        values: sorted.map(p => p[1])
      };
    }

    function renderOrdersTable(orders) {
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = orders.slice(0, 100).map(o => `
        <tr>
          <td><span class="order-id" onclick="showOrderDetail('${o.order_number}')">${o.order_number}</span></td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
          <td>${o.customer_name || 'N/A'}<br><small style="color: var(--muted)">${o.customer_email}</small></td>
          <td style="font-weight: 600">$${(o.total || 0).toFixed(2)}</td>
          <td>${capitalize(o.payment_method || 'N/A')}</td>
          <td><span class="badge badge-${o.status}">${capitalize(o.status)}</span></td>
        </tr>
      `).join('');
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function showOrderDetail(orderNumber) {
      const order = allOrders.find(o => o.order_number === orderNumber);
      if (!order) return;

      document.getElementById('modalOrderNumber').textContent = `Order ${orderNumber}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="detail-row"><div class="detail-label">Date:</div><div>${new Date(order.created_at).toLocaleString()}</div></div>
        <div class="detail-row"><div class="detail-label">Customer:</div><div>${order.customer_name}</div></div>
        <div class="detail-row"><div class="detail-label">Email:</div><div>${order.customer_email}</div></div>
        <div class="detail-row"><div class="detail-label">Phone:</div><div>${order.customer_phone || 'N/A'}</div></div>
        <div class="detail-row"><div class="detail-label">Address:</div><div>${order.customer_address || 'N/A'}</div></div>
        <div class="detail-row"><div class="detail-label">Total:</div><div style="font-weight: 700; font-size: 18px">$${(order.total || 0).toFixed(2)}</div></div>
        <div class="detail-row"><div class="detail-label">Payment:</div><div>${capitalize(order.payment_method)}</div></div>
        <div class="detail-row"><div class="detail-label">Status:</div><div><span class="badge badge-${order.status}">${capitalize(order.status)}</span></div></div>
        <div class="detail-row"><div class="detail-label">Items:</div><div>${order.items ? order.items.map(i => `${i.name} × ${i.qty}`).join('<br>') : 'N/A'}</div></div>
      `;
      document.getElementById('orderModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('orderModal').classList.remove('show');
    }

    // Table sorting
    let sortColumn = 'created_at';
    let sortAsc = false;

    function sortTable(column) {
      sortAsc = sortColumn === column ? !sortAsc : false;
      sortColumn = column;
      
      const sorted = [...allOrders].sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];
        
        if (column === 'created_at') {
          aVal = new Date(aVal);
          bVal = new Date(bVal);
        }
        
        if (aVal < bVal) return sortAsc ? -1 : 1;
        if (aVal > bVal) return sortAsc ? 1 : -1;
        return 0;
      });
      
      allOrders = sorted;
      updateDashboard();
    }

    // Filters
    document.getElementById('statusFilter')?.addEventListener('change', applyFilters);
    document.getElementById('paymentFilter')?.addEventListener('change', applyFilters);

    function applyFilters() {
      const statusFilter = document.getElementById('statusFilter').value;
      const paymentFilter = document.getElementById('paymentFilter').value;
      
      let filtered = [...allOrders];
      
      if (statusFilter !== 'all') {
        filtered = filtered.filter(o => o.status === statusFilter);
      }
      
      if (paymentFilter !== 'all') {
        filtered = filtered.filter(o => o.payment_method?.toLowerCase() === paymentFilter);
      }
      
      filtered = filterOrdersByDate(filtered, currentRange);
      renderOrdersTable(filtered);
    }
  </script>
</body>
</html>
