<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantix Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e1a; color: #fff; }
    
    header { background: #1a1f2e; padding: 16px 32px; border-bottom: 1px solid #2a3441; }
    header h1 { font-size: 20px; }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 32px; }
    
    .date-range { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .date-btn { padding: 10px 20px; background: #1a1f2e; border: 1px solid #2a3441; color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .date-btn:hover, .date-btn.active { background: #3b82f6; border-color: #3b82f6; }
    
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat { background: #1a1f2e; padding: 24px; border-radius: 12px; border: 1px solid #2a3441; }
    .stat-label { font-size: 12px; color: #9ca3af; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; }
    .stat-change { font-size: 14px; margin-top: 4px; }
    .stat-change.up { color: #10b981; }
    .stat-change.down { color: #ef4444; }
    
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px; }
    .chart-card { background: #1a1f2e; padding: 24px; border-radius: 12px; border: 1px solid #2a3441; }
    .chart-card h2 { font-size: 16px; margin-bottom: 20px; }
    
    .table-card { background: #1a1f2e; border-radius: 12px; border: 1px solid #2a3441; overflow: hidden; }
    .table-header { padding: 20px 24px; border-bottom: 1px solid #2a3441; display: flex; justify-content: space-between; align-items: center; }
    .table-header h2 { font-size: 18px; }
    .table-filters { display: flex; gap: 12px; }
    .table-filters select { padding: 8px 12px; background: #0a0e1a; border: 1px solid #2a3441; color: #fff; border-radius: 6px; }
    
    table { width: 100%; border-collapse: collapse; }
    thead { background: #0a0e1a; position: sticky; top: 0; }
    th { padding: 12px 24px; text-align: left; font-size: 12px; text-transform: uppercase; color: #9ca3af; cursor: pointer; }
    td { padding: 16px 24px; border-bottom: 1px solid #2a3441; }
    tr:hover { background: #242938; }
    
    @media (max-width: 768px) {
      .container { padding: 16px; }
      .stats { grid-template-columns: 1fr; }
      .charts { grid-template-columns: 1fr; }
      .table-filters { flex-direction: column; width: 100%; }
      .table-filters select { width: 100%; }
      th:nth-child(3), td:nth-child(3),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vantix Analytics Dashboard</h1>
  </header>

  <div class="container">
    <!-- Date Range -->
    <div class="date-range">
      <button class="date-btn active" data-range="today">Today</button>
      <button class="date-btn" data-range="yesterday">Yesterday</button>
      <button class="date-btn" data-range="7d">Last 7 Days</button>
      <button class="date-btn" data-range="30d">Last 30 Days</button>
      <button class="date-btn" data-range="90d">Last 90 Days</button>
      <button class="date-btn" data-range="mtd">Month to Date</button>
      <button class="date-btn" data-range="ytd">Year to Date</button>
      <button class="date-btn" data-range="all">All Time</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="revenue">$0</div>
        <div class="stat-change" id="revenueChange">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Orders</div>
        <div class="stat-value" id="orders">0</div>
        <div class="stat-change" id="ordersChange">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Average Order</div>
        <div class="stat-value" id="avg">$0</div>
        <div class="stat-change" id="avgChange">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Net Profit</div>
        <div class="stat-value" id="profit">$0</div>
        <div class="stat-change" id="profitChange">—</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-card">
        <h2>Revenue Over Time</h2>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="chart-card">
        <h2>Top Products</h2>
        <canvas id="productsChart"></canvas>
      </div>
    </div>

    <!-- Orders Table -->
    <div class="table-card">
      <div class="table-header">
        <h2>Recent Orders</h2>
        <div class="table-filters">
          <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="shipped">Shipped</option>
          </select>
          <select id="paymentFilter">
            <option value="all">All Payments</option>
            <option value="zelle">Zelle</option>
            <option value="credit_card">Credit Card</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('order_number')">Order #</th>
            <th onclick="sortTable('created_at')">Date</th>
            <th onclick="sortTable('customer_name')">Customer</th>
            <th onclick="sortTable('total')">Total</th>
            <th onclick="sortTable('payment_method')">Payment</th>
            <th onclick="sortTable('status')">Status</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ctujbxqcyfcrhlyvafbl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0dWpieHFjeWZjcmhseXZhZmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM3NjI3MzgsImV4cCI6MjAzOTMzODczOH0.wv8g_MJt0r6VV5c38oJ5xFjgzD7xb-PmXj_YY4piBfs';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allOrders = [];
    let currentRange = 'today';
    let revenueChart, productsChart;

    // Init
    init();

    async function init() {
      await loadOrders();
      setupDateFilters();
      setupFilters();
      updateDashboard();
    }

    async function loadOrders() {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('Error:', error);
        return;
      }
      
      allOrders = data || [];
    }

    function setupDateFilters() {
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRange = btn.dataset.range;
          updateDashboard();
        });
      });
    }

    function setupFilters() {
      document.getElementById('statusFilter').addEventListener('change', applyFilters);
      document.getElementById('paymentFilter').addEventListener('change', applyFilters);
    }

    function getDateRange(range) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      switch(range) {
        case 'today':
          return { start: today, end: new Date() };
        case 'yesterday':
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);
          return { start: yesterday, end: today };
        case '7d':
          const week = new Date(today);
          week.setDate(week.getDate() - 7);
          return { start: week, end: new Date() };
        case '30d':
          const month = new Date(today);
          month.setDate(month.getDate() - 30);
          return { start: month, end: new Date() };
        case '90d':
          const quarter = new Date(today);
          quarter.setDate(quarter.getDate() - 90);
          return { start: quarter, end: new Date() };
        case 'mtd':
          return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date() };
        case 'ytd':
          return { start: new Date(now.getFullYear(), 0, 1), end: new Date() };
        case 'all':
          return { start: new Date(2020, 0, 1), end: new Date() };
        default:
          return { start: today, end: new Date() };
      }
    }

    function filterByDate(orders, range) {
      const { start, end } = getDateRange(range);
      return orders.filter(o => {
        const date = new Date(o.created_at);
        return date >= start && date <= end;
      });
    }

    function updateDashboard() {
      const filtered = filterByDate(allOrders, currentRange);
      updateStats(filtered);
      updateCharts(filtered);
      renderTable(filtered);
    }

    function updateStats(orders) {
      const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
      const profit = orders.reduce((sum, o) => sum + (o.net_profit || 0), 0);
      const avg = orders.length > 0 ? revenue / orders.length : 0;

      document.getElementById('revenue').textContent = '$' + revenue.toFixed(2);
      document.getElementById('orders').textContent = orders.length;
      document.getElementById('avg').textContent = '$' + avg.toFixed(2);
      document.getElementById('profit').textContent = '$' + profit.toFixed(2);

      // Calculate changes
      const prevOrders = getPreviousPeriod();
      const prevRevenue = prevOrders.reduce((sum, o) => sum + (o.total || 0), 0);
      const prevProfit = prevOrders.reduce((sum, o) => sum + (o.net_profit || 0), 0);
      const prevAvg = prevOrders.length > 0 ? prevRevenue / prevOrders.length : 0;

      updateChange('revenueChange', revenue, prevRevenue);
      updateChange('ordersChange', orders.length, prevOrders.length);
      updateChange('avgChange', avg, prevAvg);
      updateChange('profitChange', profit, prevProfit);
    }

    function getPreviousPeriod() {
      const { start, end } = getDateRange(currentRange);
      const duration = end - start;
      const prevStart = new Date(start - duration);
      const prevEnd = new Date(start);
      
      return allOrders.filter(o => {
        const date = new Date(o.created_at);
        return date >= prevStart && date < prevEnd;
      });
    }

    function updateChange(id, current, previous) {
      const el = document.getElementById(id);
      if (previous === 0) {
        el.textContent = '—';
        el.className = 'stat-change';
        return;
      }
      
      const change = ((current - previous) / previous) * 100;
      const sign = change >= 0 ? '+' : '';
      el.textContent = sign + change.toFixed(1) + '% vs prev';
      el.className = change >= 0 ? 'stat-change up' : 'stat-change down';
    }

    function updateCharts(orders) {
      // Revenue chart
      const dates = {};
      orders.forEach(o => {
        const d = new Date(o.created_at).toLocaleDateString();
        dates[d] = (dates[d] || 0) + (o.total || 0);
      });

      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
          labels: Object.keys(dates),
          datasets: [{
            label: 'Revenue',
            data: Object.values(dates),
            borderColor: '#3b82f6',
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(59, 130, 246, 0.1)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: '#2a3441' } },
            x: { ticks: { color: '#9ca3af' }, grid: { display: false } }
          }
        }
      });

      // Products chart
      const products = {};
      orders.forEach(o => {
        if (o.items) {
          o.items.forEach(item => {
            const name = item.name || 'Unknown';
            products[name] = (products[name] || 0) + (item.qty * item.price);
          });
        }
      });
      const sorted = Object.entries(products).sort((a, b) => b[1] - a[1]).slice(0, 5);

      if (productsChart) productsChart.destroy();
      productsChart = new Chart(document.getElementById('productsChart'), {
        type: 'doughnut',
        data: {
          labels: sorted.map(p => p[0]),
          datasets: [{
            data: sorted.map(p => p[1]),
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af' } } }
        }
      });
    }

    function renderTable(orders) {
      const html = orders.slice(0, 100).map(o => `
        <tr>
          <td>${o.order_number}</td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
          <td>${o.customer_name || 'N/A'}</td>
          <td style="font-weight: 600">$${(o.total || 0).toFixed(2)}</td>
          <td>${capitalize(o.payment_method || 'N/A')}</td>
          <td>${capitalize(o.status || 'N/A')}</td>
        </tr>
      `).join('');
      document.getElementById('ordersTable').innerHTML = html;
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    let sortColumn = 'created_at';
    let sortAsc = false;

    function sortTable(column) {
      sortAsc = sortColumn === column ? !sortAsc : false;
      sortColumn = column;
      
      allOrders.sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];
        
        if (column === 'created_at') {
          aVal = new Date(aVal);
          bVal = new Date(bVal);
        }
        
        if (aVal < bVal) return sortAsc ? -1 : 1;
        if (aVal > bVal) return sortAsc ? 1 : -1;
        return 0;
      });
      
      updateDashboard();
    }

    function applyFilters() {
      const status = document.getElementById('statusFilter').value;
      const payment = document.getElementById('paymentFilter').value;
      
      let filtered = [...allOrders];
      
      if (status !== 'all') {
        filtered = filtered.filter(o => o.status === status);
      }
      
      if (payment !== 'all') {
        filtered = filtered.filter(o => o.payment_method?.toLowerCase() === payment);
      }
      
      filtered = filterByDate(filtered, currentRange);
      renderTable(filtered);
    }
  </script>
</body>
</html>
