<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vantix Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e1a; color: #fff; }
    
    header { background: #1a1f2e; padding: 16px 32px; border-bottom: 1px solid #2a3441; }
    header h1 { font-size: 20px; }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 32px; }
    
    .loading { text-align: center; padding: 100px 20px; font-size: 18px; color: #9ca3af; }
    
    .date-range { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .date-btn { padding: 10px 20px; background: #1a1f2e; border: 1px solid #2a3441; color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; border: none; }
    .date-btn:hover, .date-btn.active { background: #3b82f6; }
    
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat { background: #1a1f2e; padding: 24px; border-radius: 12px; border: 1px solid #2a3441; }
    .stat-label { font-size: 12px; color: #9ca3af; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; }
    
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px; }
    .chart-card { background: #1a1f2e; padding: 24px; border-radius: 12px; border: 1px solid #2a3441; }
    .chart-card h2 { font-size: 16px; margin-bottom: 20px; }
    
    .table-card { background: #1a1f2e; border-radius: 12px; border: 1px solid #2a3441; overflow: hidden; }
    .table-header { padding: 20px 24px; border-bottom: 1px solid #2a3441; }
    .table-header h2 { font-size: 18px; }
    
    table { width: 100%; border-collapse: collapse; }
    thead { background: #0a0e1a; }
    th { padding: 12px 24px; text-align: left; font-size: 12px; text-transform: uppercase; color: #9ca3af; }
    td { padding: 16px 24px; border-bottom: 1px solid #2a3441; font-size: 14px; }
    tr:hover { background: #242938; }
    
    @media (max-width: 768px) {
      .container { padding: 16px; }
      .stats { grid-template-columns: 1fr; }
      .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vantix Analytics Dashboard</h1>
  </header>

  <div class="container">
    <div class="loading" id="loading">Loading order data...</div>
    
    <div id="dashboard" style="display: none;">
      <div class="date-range">
        <button class="date-btn active" data-range="all">All Time</button>
        <button class="date-btn" data-range="30d">Last 30 Days</button>
        <button class="date-btn" data-range="7d">Last 7 Days</button>
        <button class="date-btn" data-range="today">Today</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="revenue">$0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Orders</div>
          <div class="stat-value" id="orders">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Average Order</div>
          <div class="stat-value" id="avg">$0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Net Profit</div>
          <div class="stat-value" id="profit">$0</div>
        </div>
      </div>

      <div class="charts">
        <div class="chart-card">
          <h2>Revenue Over Time</h2>
          <canvas id="revenueChart" height="80"></canvas>
        </div>
        <div class="chart-card">
          <h2>Payment Methods</h2>
          <canvas id="paymentChart" height="80"></canvas>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h2>Recent Orders</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1n1YnFDUHyufWPXLAFOxz6RNkPGLr6gajG8JVc00cxTs/gviz/tq?tqx=out:csv&sheet=Orders';
    
    let allOrders = [];
    let currentRange = 'all';
    let revenueChart, paymentChart;

    init();

    async function init() {
      try {
        await loadOrders();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        setupDateFilters();
        updateDashboard();
      } catch (err) {
        document.getElementById('loading').innerHTML = `
          <div style="color: #ef4444;">Error loading data: ${err.message}</div>
          <div style="margin-top: 20px; font-size: 14px; color: #9ca3af;">
            Check browser console for details
          </div>
        `;
        console.error('Full error:', err);
      }
    }

    async function loadOrders() {
      const response = await fetch(SHEET_URL);
      const csvText = await response.text();
      
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allOrders = results.data.map(row => ({
            order_number: row['Order#'] || '',
            timestamp: row['Timestamp'] || '',
            email: row['Email'] || '',
            name: row['Name'] || '',
            phone: row['Phone'] || '',
            product: row['Product'] || '',
            qty: parseInt(row['Qty']) || 0,
            payment: (row['Payment'] || '').toLowerCase(),
            subtotal: parseFloat((row['Subtotal'] || '').replace('$', '')) || 0,
            discount: parseFloat((row['Discount'] || '').replace('$', '')) || 0,
            shipping: parseFloat((row['Shipping'] || '').replace('$', '')) || 0,
            total: parseFloat((row['Total'] || '').replace('$', '')) || 0,
            net_profit: parseFloat((row['Net Profit'] || '').replace('$', '')) || 0,
            status: (row['Status'] || 'pending').toLowerCase()
          })).filter(o => o.order_number && o.total > 0);
          
          console.log('Loaded', allOrders.length, 'orders');
        }
      });
    }

    function setupDateFilters() {
      document.querySelectorAll('.date-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentRange = btn.dataset.range;
          updateDashboard();
        });
      });
    }

    function getDateRange(range) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      switch(range) {
        case 'today':
          return { start: today, end: new Date() };
        case '7d':
          const week = new Date(today);
          week.setDate(week.getDate() - 7);
          return { start: week, end: new Date() };
        case '30d':
          const month = new Date(today);
          month.setDate(month.getDate() - 30);
          return { start: month, end: new Date() };
        case 'all':
          return { start: new Date(2020, 0, 1), end: new Date() };
        default:
          return { start: today, end: new Date() };
      }
    }

    function filterByDate(orders, range) {
      const { start, end } = getDateRange(range);
      return orders.filter(o => {
        const date = new Date(o.timestamp);
        return date >= start && date <= end;
      });
    }

    function updateDashboard() {
      const filtered = filterByDate(allOrders, currentRange);
      updateStats(filtered);
      updateCharts(filtered);
      renderTable(filtered);
    }

    function updateStats(orders) {
      const revenue = orders.reduce((sum, o) => sum + o.total, 0);
      const profit = orders.reduce((sum, o) => sum + o.net_profit, 0);
      const avg = orders.length > 0 ? revenue / orders.length : 0;

      document.getElementById('revenue').textContent = '$' + revenue.toFixed(2);
      document.getElementById('orders').textContent = orders.length;
      document.getElementById('avg').textContent = '$' + avg.toFixed(2);
      document.getElementById('profit').textContent = '$' + profit.toFixed(2);
    }

    function updateCharts(orders) {
      // Revenue over time
      const dates = {};
      orders.forEach(o => {
        const d = new Date(o.timestamp).toLocaleDateString();
        dates[d] = (dates[d] || 0) + o.total;
      });

      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
          labels: Object.keys(dates).slice(-30),
          datasets: [{
            label: 'Revenue',
            data: Object.values(dates).slice(-30),
            borderColor: '#3b82f6',
            tension: 0.4,
            fill: true,
            backgroundColor: 'rgba(59, 130, 246, 0.1)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: '#2a3441' } },
            x: { ticks: { color: '#9ca3af' }, grid: { display: false } }
          }
        }
      });

      // Payment methods
      const payments = {};
      orders.forEach(o => {
        const method = o.payment || 'unknown';
        payments[method] = (payments[method] || 0) + o.total;
      });

      if (paymentChart) paymentChart.destroy();
      paymentChart = new Chart(document.getElementById('paymentChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(payments).map(p => p.charAt(0).toUpperCase() + p.slice(1)),
          datasets: [{
            data: Object.values(payments),
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af' } } }
        }
      });
    }

    function renderTable(orders) {
      const html = orders.slice(0, 100).map(o => `
        <tr>
          <td style="font-family: monospace; color: #3b82f6; font-weight: 600;">${o.order_number}</td>
          <td>${new Date(o.timestamp).toLocaleDateString()}</td>
          <td>${o.name}</td>
          <td style="font-weight: 600;">$${o.total.toFixed(2)}</td>
          <td>${capitalize(o.payment)}</td>
          <td>${capitalize(o.status)}</td>
        </tr>
      `).join('');
      document.getElementById('ordersTable').innerHTML = html || '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #9ca3af;">No orders found</td></tr>';
    }

    function capitalize(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : 'N/A';
    }
  </script>
</body>
</html>
