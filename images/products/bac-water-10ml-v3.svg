<svg width="1280" height="999" viewBox="0 0 1280 999" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1280" height="999" fill="url(#bg)"/>
  
  <!-- Simple centered label card -->
  <g transform="translate(640, 500)">
    <rect x="-350" y="-220" width="700" height="440" rx="16" fill="url(#label)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Vantix Bio branding -->
    <text x="0" y="-140" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="28" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3">VANTIX BIO</text>
    
    <!-- Product name -->
    <text x="0" y="-70" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">Bacteriostatic Water</text>
    
    <!-- Concentration -->
    <text x="0" y="-20" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="middle">0.9% Benzyl Alcohol</text>
    
    <!-- Volume - changed from #2563eb (bright blue) to #0f172a (dark slate) -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="64" font-weight="700" fill="#0f172a" text-anchor="middle">10mL</text>
    
    <!-- Divider line -->
    <line x1="-250" y1="90" x2="250" y2="90" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Bottom text -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">For Research Use Only</text>
  </g>
</svg>
