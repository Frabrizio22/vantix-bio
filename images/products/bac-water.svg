<svg width="1280" height="999" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="999" fill="url(#bg)"/>
  
  <!-- Shadow -->
  <ellipse cx="640" cy="850" rx="180" ry="30" fill="#94a3b8" opacity="0.2"/>
  
  <!-- Vial body -->
  <rect x="540" y="250" width="200" height="550" rx="20" fill="url(#vial)" stroke="#60a5fa" stroke-width="3"/>
  
  <!-- Vial cap -->
  <rect x="565" y="220" width="150" height="40" rx="8" fill="#1e40af"/>
  <circle cx="640" cy="240" r="25" fill="#3b82f6"/>
  
  <!-- Water fill -->
  <rect x="550" y="350" width="180" height="430" rx="15" fill="#bfdbfe" opacity="0.6"/>
  
  <!-- Highlights -->
  <rect x="560" y="270" width="30" height="480" rx="15" fill="#ffffff" opacity="0.3"/>
  
  <!-- Label area -->
  <rect x="580" y="500" width="120" height="160" rx="5" fill="#ffffff" opacity="0.9"/>
  
  <!-- Text -->
  <text x="640" y="560" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#0f172a">BAC</text>
  <text x="640" y="600" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#475569">WATER</text>
  <text x="640" y="640" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#64748b">10mL</text>
  
  <!-- Vantix branding -->
  <text x="640" y="900" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#60a5fa" letter-spacing="2">VANTIX BIO</text>
</svg>
