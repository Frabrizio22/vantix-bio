<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f8fafc"/>
  
  <!-- Vial container -->
  <g transform="translate(200, 200)">
    <!-- Vial body -->
    <rect x="-60" y="-100" width="120" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Liquid level -->
    <rect x="-55" y="-20" width="110" height="100" rx="4" fill="#dbeafe" opacity="0.6"/>
    
    <!-- Cap -->
    <rect x="-65" y="-115" width="130" height="18" rx="4" fill="#94a3b8"/>
    <circle cx="0" cy="-106" r="8" fill="#64748b"/>
    
    <!-- Label area -->
    <rect x="-50" y="-60" width="100" height="60" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Text -->
    <text x="0" y="-40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">VANTIX BIO</text>
    <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">BAC Water</text>
    <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">30mL</text>
    
    <!-- Measurement marks -->
    <line x1="-60" y1="20" x2="-55" y2="20" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-60" y1="40" x2="-55" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <line x1="-60" y1="60" x2="-55" y2="60" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- "For reconstitution" note -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Bacteriostatic Water</text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">0.9% Benzyl Alcohol</text>
  </g>
</svg>
