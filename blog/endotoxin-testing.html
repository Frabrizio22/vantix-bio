            "@type": "Answer",
            "text": "Yes. Janoshik offers LAL endotoxin testing as an add-on service alongside their standard HPLC purity and LC-MS identity testing. However, endotoxin testing is NOT included in Janoshik's standard peptide panel — vendors must specifically request and pay for it (~$150–175 per sample). If endotoxin results don't appear on a vendor's Janoshik COA, the test was never ordered. Vantix Bio includes LAL endotoxin testing on every batch, with results reported in EU/mL on the COA."
          }
        },
        {
          "@type": "Question",
          "name": "What are endotoxins and why do they matter in peptide research?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Endotoxins are lipopolysaccharides (LPS) embedded in the outer membrane of Gram-negative bacteria. Even after sterilization kills the bacteria, LPS fragments persist and activate Toll-like receptor 4 (TLR4), triggering inflammatory cascades including TNF-α, IL-1β, and IL-6 release (Poltorak et al., Science, 1998; PMID 9851930). In preclinical research, this creates a confounding inflammatory signal that can mask or distort the actual pharmacological activity of the peptide under study."
          }
        },
        {
          "@type": "Question",
          "name": "What is the LAL test and how does it detect endotoxins?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Limulus Amebocyte Lysate (LAL) test uses a clotting enzyme extracted from the blood of Atlantic horseshoe crabs (Limulus polyphemus). When exposed to bacterial endotoxins, the lysate triggers a measurable enzymatic cascade. The kinetic chromogenic variant quantifies endotoxin concentration down to 0.005 EU/mL, making it the pharmacopeial gold standard recognized by USP <85>, EP 2.6.14, and JP (Fennrich et al., ATLA, 2016; PMID 27494624)."
          }
        },
        {
          "@type": "Question",
          "name": "What endotoxin limits does Vantix Bio enforce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vantix Bio requires every batch to test at or below 1.0 EU/mg — a research-grade threshold stricter than typical vendor specifications. This is verified through quantitative LAL testing performed by Janoshik. Results are reported in EU/mL on batch-specific COAs accessible through our verification portal."
          }
        },
        {
          "@type": "Question",
          "name": "Why don't all peptide vendors test for endotoxins?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LAL testing adds cost per batch (typically $150–300 per sample) and requires specialized equipment and trained technicians. Vendors that skip endotoxin testing rely solely on HPLC purity data, which measures chemical purity but cannot detect biological contaminants like endotoxins. A peptide can be 99% pure by HPLC and still carry endotoxin levels high enough to confound research results. If endotoxin results don't appear on the COA, the test wasn't performed."
          }
        },
